{% extends 'core/auth_base.html' %}

{% block title %}Reset Password | Roriri Project Desk{% endblock %}

{% block auth_content %}
<div class="auth-card">
    <p class="eyebrow">Security</p>
    <h2>Set a new password</h2>
    {% if validlink %}
        <form method="post" class="stacked-form">
            {% csrf_token %}
            <label>New Password {{ form.new_password1 }}</label>
            <label>Confirm Password {{ form.new_password2 }}</label>
            <button class="btn primary" type="submit">Update Password</button>
        </form>
    {% else %}
        <p class="muted">This reset link is invalid or has expired.</p>
        <a class="btn secondary" href="{% url 'login' %}">Back to Login</a>
    {% endif %}
</div>
{% endblock %}
