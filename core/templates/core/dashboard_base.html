{% extends 'core/base.html' %}
{% load static %}

{% block body %}
<div class="app-shell">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-mark small"><img src="{% static 'core/img/new_logo.png' %}" alt="Roriri logo"></div>
            <div>
                <strong>Roriri Desk</strong>
                <span>{{ request.user.get_full_name|default:request.user.username }}</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            {% block nav %}{% endblock %}
        </nav>
        <label class="theme-switch" for="theme-toggle" aria-label="Toggle dark mode">
            <input type="checkbox" id="theme-toggle">
            <div class="slider round">
                <svg class="sun" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                <svg class="moon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </div>
        </label>
        <a class="logout-link" href="{% url 'logout' %}">Logout</a>
    </aside>
    <main class="content">
        <button class="menu-toggle" type="button" data-toggle-sidebar>Menu</button>
        {% include 'core/partials/messages.html' %}
        {% block content %}{% endblock %}
    </main>
</div>
{% endblock %}
